{% extends "base.html" %}
{% load i18n %}
{% load django_bootstrap5 %}

{% block title %}{% translate 'Create tag' %}{% endblock %}

{% block content %}
<h2>{% trans 'Create tag' %}</h2>

<form method="post" action="{% url 'labels.create' %}" class="form">
    {% csrf_token %}

    {% bootstrap_form form %}

    {% bootstrap_button button_type="submit" content=_('Create') %}
</form>
{% endblock %}
